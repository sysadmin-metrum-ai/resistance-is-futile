version: '3.8'

services:
  # Caddy Reverse Proxy
  caddy:
    image: caddy:2-alpine
    container_name: drone-swarm-caddy
    ports:
      - "3003:3003"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - dashboard
    networks:
      - drone-network
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: drone-swarm-postgres
    environment:
      POSTGRES_DB: drones
      POSTGRES_USER: droneuser
      POSTGRES_PASSWORD: dronetime
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U droneuser -d drones"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - drone-network

  # PostgREST API
  postgrest:
    image: postgrest/postgrest:v12.0.2
    container_name: drone-swarm-postgrest
    environment:
      PGRST_DB_URI: postgres://droneuser:dronetime@postgres:5432/drones
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - drone-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:alpine
    container_name: drone-swarm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - drone-network

  # Drone Swarm API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: drone-swarm-api
    environment:
      POSTGREST_URL: http://postgrest:3000
      POSTGREST_API_KEY: ${POSTGREST_API_KEY:-}
      REDIS_URL: redis://redis:6379
      API_KEY: ${API_KEY:-}
      MOCK_MODE: ${MOCK_MODE:-true}
      IMAGE_STORAGE_PATH: /app/captures
    # No port mapping needed - accessed via Caddy proxy internally
    expose:
      - "8000"
    volumes:
      - ./captures:/app/captures
    depends_on:
      postgres:
        condition: service_healthy
      postgrest:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - drone-network
    restart: unless-stopped

  # Dashboard UI
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: drone-swarm-dashboard
    # No port mapping needed - accessed via Caddy proxy
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_started
    networks:
      - drone-network
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  drone-network:
    driver: bridge
